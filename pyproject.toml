[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyretread"
version = "0.2.0.dev0"
description = "Assistive tyre tread condition screening from photographs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Machum Roy Choudhury" }]

# Lower bounds only, with upper bounds on the libraries whose behaviour the
# measurements depend on. scikit-learn's estimator defaults and numpy's dtype
# promotion have both changed in ways that would silently move a reported metric,
# so those are capped at the next major version.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4,<2",
    "pandas>=2.1",
    "pillow>=10.2",
    "joblib>=1.3",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# Kept out of the runtime install so the deployed backend stays small: matplotlib
# and the experiment scripts are never imported by the API.
research = ["matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["tyretread*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:tyretread.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E501"]
"src/*" = ["ALL"]  # the original scripts are preserved as published, not linted
